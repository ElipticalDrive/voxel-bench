# Long view distance over terrain: full-resolution streaming versus level of detail.
# bricks + refloor streams 24 chunks (768 blocks) at full resolution; the LOD variants (a
# client `max_lod`) reach the same distance (radius × 2^max_lod chunks, so the reference
# compares like with like) with far fewer chunks, at coarser resolution far away.
name = "far"

[scene]
generator = { type = "terrain", seed = 7 }
camera = { type = "flythrough", points = [[0, 170, 0], [500, 200, 300], [1000, 170, -150], [1500, 210, 200]] }

[run]
frames = 400
warmup = 20
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 24

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "client", role = "client", component = "pick" },
    { node = "client", knobs = { max_lod = 1, radius = 12 } },
]
label = "lod r12+1"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "client", role = "client", component = "pick" },
    { node = "client", knobs = { max_lod = 2, radius = 6 } },
]
label = "lod r6+2"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "client", role = "client", component = "pick" },
    { node = "client", knobs = { max_lod = 3, radius = 3 } },
]
label = "lod r3+3"

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[output]
compare = { every = 100 }
save = { every = 200 }
