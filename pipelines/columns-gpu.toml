# Comanche-style Voxel Space (2.5D, no overhangs) in a compute shader: one thread per screen column marches a heightmap front to back with a y-buffer
# A pipeline graph: start a renderer from it with `graph = "columns-gpu"` and `edits`.

executor = "gpu"

[nodes.kernel]
role = "traversal"
component = "heightfield"

[nodes.kernel.inputs]
storage = "storage"

[nodes.shading]
role = "shading"
component = "direct"

[nodes.shading.inputs]
hits = "visibility"
shadow = "kernel"

[nodes.storage]
role = "storage"
component = "heightmap"

[nodes.storage.inputs]
changes = "world"

[nodes.visibility]
role = "visibility"
component = "columns"

[nodes.visibility.inputs]
storage = "storage"

[nodes.world]
role = "world"
component = "world"
