# Comanche-style Voxel Space (2.5D) on the CPU, rayon-parallel over screen columns
# A pipeline graph: start a renderer from it with `graph = "columns-cpu"` and `edits`.

executor = "cpu"

[nodes.kernel]
role = "traversal"
component = "heightfield"

[nodes.kernel.inputs]
storage = "storage"

[nodes.shading]
role = "shading"
component = "direct"

[nodes.shading.inputs]
hits = "visibility"
shadow = "kernel"

[nodes.storage]
role = "storage"
component = "heightmap"

[nodes.storage.inputs]
changes = "world"

[nodes.visibility]
role = "visibility"
component = "columns"

[nodes.visibility.inputs]
storage = "storage"

[nodes.world]
role = "world"
component = "world"
