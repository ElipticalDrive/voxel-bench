# CPU software rasteriser: the geometry component's quads, homogeneous clipping, tiled multithreaded edge-function raster into a visibility buffer, deferred exact shading (reference model, f64)
# A pipeline graph: start a renderer from it with `graph = "raster-cpu"` and `edits`.

executor = "cpu"

[nodes.draw]
role = "draw"
component = "raster"

[nodes.draw.inputs]
faces = "visibility"

[nodes.geometry]
role = "geometry"
component = "greedy"

[nodes.geometry.inputs]
changes = "world"

[nodes.shading]
role = "shading"
component = "direct"

[nodes.shading.inputs]
hits = "draw"

[nodes.visibility]
role = "visibility"
component = "faces"

[nodes.visibility.inputs]
faces = "geometry"

[nodes.world]
role = "world"
component = "world"
