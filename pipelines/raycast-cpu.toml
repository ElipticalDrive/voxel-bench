# CPU, multi-threaded (rayon), one monomorphised instance per storage; ray packets and AVX2/AVX-512 hot loops
# A pipeline graph: start a renderer from it with `graph = "raycast-cpu"` and `edits`.

executor = "cpu"

[nodes.kernel]
role = "traversal"
component = "refloor"

[nodes.kernel.inputs]
storage = "storage"

[nodes.shading]
role = "shading"
component = "direct"

[nodes.shading.inputs]
hits = "visibility"
shadow = "kernel"

[nodes.storage]
role = "storage"
component = "bricks"

[nodes.storage.inputs]
changes = "world"

[nodes.visibility]
role = "visibility"
component = "raycast"

[nodes.visibility.inputs]
primary = "kernel"

[nodes.world]
role = "world"
component = "world"
