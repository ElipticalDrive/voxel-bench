# GPU compute shaders (wgpu / WGSL, on Vulkan here): one thread per pixel walks the composed storage and visibility
# A pipeline graph: start a renderer from it with `graph = "raycast-gpu"` and `edits`.

executor = "gpu"

[nodes.kernel]
role = "traversal"
component = "refloor"

[nodes.kernel.inputs]
storage = "storage"

[nodes.meshes]
role = "meshes"
component = "composite"

[nodes.meshes.inputs]
changes = "world"
shadow = "kernel"

[nodes.shading]
role = "shading"
component = "direct"

[nodes.shading.inputs]
hits = "visibility"
shadow = "kernel"

[nodes.storage]
role = "storage"
component = "bricks"

[nodes.storage.inputs]
changes = "world"

[nodes.visibility]
role = "visibility"
component = "raycast"

[nodes.visibility.inputs]
meshes = "meshes"
primary = "kernel"

[nodes.world]
role = "world"
component = "world"
