# 3D checkerboard filling a 96^3 cube: every solid block shows all six faces (2.6M faces,
# none mergeable, nearly all hidden: the worst case for meshing and rasterising), yet the
# pattern is perfectly regular (a DAG stores it in a handful of nodes). Compare random.toml:
# similar density, no regularity.
name = "checker"

[scene]
generator = { type = "checker", size = 96 }
camera = { type = "orbit", center = [48, 48, 48], radius = 150, height = 60, period = 300 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit"]
view_radius = 6

[[renderer]]
compose = { preset = "raycast-gpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raster-gpu", storage = "bricks", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "raster-cpu", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "greedy", traversal = "rayquery" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "boxes", traversal = "rayquery" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "tree64", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-cpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "distance", traversal = "sphere" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "svo_dag", traversal = "refloor" }

[output]
compare = { every = 100 }
save = { every = 0 }
