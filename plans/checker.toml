# 3D checkerboard filling a 96^3 cube: every solid block shows all six faces (2.6M faces,
# none mergeable, nearly all hidden: the worst case for meshing and rasterising), yet the
# pattern is perfectly regular (a DAG stores it in a handful of nodes). Compare random.toml:
# similar density, no regularity.
name = "checker"

[scene]
generator = { type = "checker", size = 96 }
camera = { type = "orbit", center = [48, 48, 48], radius = 150, height = 60, period = 300 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit"]
view_radius = 6

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "svo_dag" }]

[output]
compare = { every = 100 }
save = { every = 0 }
