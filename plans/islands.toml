# Floating islands scattered through a 512-block-tall volume: mostly empty space, small
# objects far apart, most rays hit nothing. Tests empty-space skipping, the cost of many
# empty chunks, and small objects at a distance (the LOD variant).
name = "islands"

[scene]
generator = { type = "islands", seed = 5 }
camera = { type = "flythrough", points = [[48, 300, 48], [600, 340, 500], [1200, 220, -100], [1800, 300, 400]] }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 16

[[renderer]]
compose = { preset = "raycast-gpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raster-gpu", storage = "bricks", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "raster-cpu", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "greedy", traversal = "rayquery" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "boxes", traversal = "rayquery" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "tree64", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-cpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "distance", traversal = "sphere" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "bricks", traversal = "refloor" }
label = "lod r4+2"
sites = { client = "pick(radius=4, max_lod=2)" }

[output]
compare = { every = 100 }
save = { every = 0 }
