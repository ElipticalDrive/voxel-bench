# Floating islands scattered through a 512-block-tall volume: mostly empty space, small
# objects far apart, most rays hit nothing. Tests empty-space skipping, the cost of many
# empty chunks, and small objects at a distance (the LOD variant).
name = "islands"

[scene]
generator = { type = "islands", seed = 5 }
camera = { type = "flythrough", points = [[48, 300, 48], [600, 340, 500], [1200, 220, -100], [1800, 300, 400]] }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 16

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "client", role = "client", component = "pick" },
    { node = "client", knobs = { max_lod = 2, radius = 4 } },
]
label = "lod r4+2"

[output]
compare = { every = 100 }
save = { every = 0 }
