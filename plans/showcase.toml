# Texture/UV sanity scene: every block type in a row plus debug-textured cubes.
name = "showcase"

[scene]
generator = { type = "showcase" }
camera = { type = "orbit", center = [20.0, 2.0, 0.0], radius = 26.0, height = 12.0, period = 120 }
lights = [
    { type = "point", position = [10.0, 4.0, 3.0], color = [1.0, 0.6, 0.3], intensity = 30.0, radius = 20.0 },
    { type = "point", position = [30.0, 4.0, -3.0], color = [0.3, 0.6, 1.0], intensity = 30.0, radius = 20.0 },
]

[run]
frames = 120
warmup = 5
resolution = [960, 540]
modes = ["unlit", "lit"]
view_radius = 4

[[renderer]]
name = "cpu-reference"

[[renderer]]
compose = { preset = "raycast-gpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raster-gpu", storage = "bricks", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "raster-cpu", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "greedy", traversal = "rayquery" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "boxes", traversal = "rayquery" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "tree64", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-cpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "distance", traversal = "sphere" }

[output]
save = { every = 30 }
