# Demo: the world streamed over modelled networks. Each lane's client receives the server's
# chunks through its own gate (none, a home connection, a bad one with heavy loss); fly fast
# (Ctrl+WASD) and watch the slower networks leave holes that fill in as chunks arrive.
name = "demo-link"

[scene]
generator = { type = "terrain", seed = 21 }
camera = { type = "static", pitch_deg = -8 }

[run]
resolution = [1280, 720]
view_radius = 8

[[renderer]]
graph = "raycast-gpu"
label = "free"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" },
    { node = "net", knobs = { bandwidth_mbps = 200.0, jitter_ms = 10.0, latency_ms = 30.0, loss = 0.01, reorder = true, resend = true } },
]
label = "home"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" },
    { node = "net", knobs = { bandwidth_mbps = 50.0, jitter_ms = 80.0, latency_ms = 150.0, loss = 0.05, reorder = true, resend = true } },
]
label = "bad"
