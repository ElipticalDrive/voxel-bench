# Long view distance over terrain: full-resolution streaming versus level of detail.
# bricks + refloor streams 24 chunks (768 blocks) at full resolution; the LOD variants (a
# per-renderer max_lod) reach the same (or greater) distance with far fewer chunks, at
# coarser resolution far away.
name = "far"

[scene]
generator = { type = "terrain", seed = 7 }
camera = { type = "flythrough", points = [[0, 170, 0], [500, 200, 300], [1000, 170, -150], [1500, 210, 200]] }

[run]
frames = 400
warmup = 20
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 24

[[renderer]]
compose = { backend = "gpu-compute", storage = "bricks", visibility = "refloor" }

[[renderer]]
compose = { backend = "gpu-compute", storage = "bricks", visibility = "refloor" }
label = "lod r12+1"
view_radius = 12
max_lod = 1

[[renderer]]
compose = { backend = "gpu-compute", storage = "bricks", visibility = "refloor" }
label = "lod r6+2"
view_radius = 6
max_lod = 2

[[renderer]]
compose = { backend = "gpu-compute", storage = "bricks", visibility = "refloor" }
label = "lod r4+3"
view_radius = 4
max_lod = 3

[[renderer]]
compose = { backend = "gpu-compute", storage = "tree64", visibility = "refloor" }

[output]
compare = { every = 100 }
save = { every = 200 }
