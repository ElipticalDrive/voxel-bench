# City: a street grid of hollow towers (a floor every 5 blocks, window openings). The camera
# drives down a street: rays run far along the street, facades hide deep interiors (overdraw
# for rasterisers, many floors behind each window for rays), towers up to 240 blocks.
name = "city"

[scene]
generator = { type = "city", seed = 3 }
camera = { type = "line", from = [5, 14, -500], to = [5, 14, 500] }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 16

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[output]
compare = { every = 100 }
save = { every = 0 }
