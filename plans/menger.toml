# Menger sponge (level 5, 243^3): deep occlusion, huge numbers of small faces and long
# ray paths through holes. Worst case for meshing; interesting for ray traversal.
name = "menger"

[scene]
generator = { type = "menger", level = 5 }
camera = { type = "orbit", center = [121.5, 121.5, 121.5], radius = 330, height = 120, period = 600 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 12

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[output]
compare = { every = 100 }
