# Voxel Cornell box: indoor lighting with a few coloured point lights and no sun.
name = "room"

[scene]
generator = { type = "room", size = 48 }
camera = { type = "static", position = [24, 24, 85], target = [24, 20, 20] }
environment = { no_sun = true, ambient = [0.03, 0.03, 0.03] }
lights = [
    { type = "point", position = [24, 44, 24], color = [1.0, 0.95, 0.85], intensity = 400.0, radius = 70.0 },
    { type = "point", position = [8, 6, 40], color = [1.0, 0.4, 0.2], intensity = 60.0, radius = 30.0 },
]

[run]
frames = 200
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 4

[[renderer]]
compose = { backend = "gpu-compute", storage = "bricks", visibility = "refloor" }

[[renderer]]
compose = { backend = "gpu-raster", storage = "bricks", geometry = "greedy", visibility = "raster" }

[[renderer]]
compose = { backend = "cpu-raster", geometry = "greedy", visibility = "raster" }

[[renderer]]
compose = { backend = "gpu-rt", geometry = "greedy", visibility = "rayquery" }

[[renderer]]
compose = { backend = "gpu-rt", geometry = "boxes", visibility = "rayquery" }

[[renderer]]
compose = { backend = "gpu-compute", storage = "tree64", visibility = "refloor" }

[[renderer]]
compose = { backend = "cpu", storage = "bricks", visibility = "refloor" }

[[renderer]]
compose = { backend = "gpu-compute", storage = "distance", visibility = "sphere" }

[output]
compare = { every = 100 }
save = { every = 0 }
