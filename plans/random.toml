# 192^3 cube of random blocks at 15% density: no coherence, maximal faces per block and
# short, divergent rays. A deliberately hostile case.
name = "random"

[scene]
generator = { type = "random", size = 192, density = 0.15, seed = 9 }
camera = { type = "orbit", center = [0, 0, 0], radius = 180, height = 60, period = 300 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit"]
view_radius = 6

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[output]
compare = { every = 100 }
