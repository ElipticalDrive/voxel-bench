# 192^3 cube of random blocks at 15% density: no coherence, maximal faces per block and
# short, divergent rays. A deliberately hostile case.
name = "random"

[scene]
generator = { type = "random", size = 192, density = 0.15, seed = 9 }
camera = { type = "orbit", center = [0, 0, 0], radius = 180, height = 60, period = 300 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit"]
view_radius = 6

[[renderer]]
compose = { backend = "gpu-compute", storage = "bricks", visibility = "refloor" }

[[renderer]]
compose = { backend = "gpu-raster", storage = "bricks", geometry = "greedy", visibility = "raster" }

[[renderer]]
name = "cpu-raster"

[[renderer]]
compose = { backend = "gpu-rt", geometry = "greedy", visibility = "rayquery" }

[[renderer]]
compose = { backend = "gpu-rt", geometry = "boxes", visibility = "rayquery" }

[[renderer]]
compose = { backend = "gpu-compute", storage = "tree64", visibility = "refloor" }

[[renderer]]
name = "cpu-simd"

[[renderer]]
compose = { backend = "gpu-compute", storage = "distance", visibility = "sphere" }

[output]
compare = { every = 100 }
