# 192^3 cube of random blocks at 15% density: no coherence, maximal faces per block and
# short, divergent rays. A deliberately hostile case.
name = "random"

[scene]
generator = { type = "random", size = 192, density = 0.15, seed = 9 }
camera = { type = "orbit", center = [0, 0, 0], radius = 180, height = 60, period = 300 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit"]
view_radius = 6

[[renderer]]
compose = { preset = "raycast-gpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raster-gpu", storage = "bricks", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "raster-cpu", geometry = "greedy", draw = "raster" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "greedy", traversal = "rayquery" }

[[renderer]]
compose = { preset = "rayquery-gpu", geometry = "boxes", traversal = "rayquery" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "tree64", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-cpu", storage = "bricks", traversal = "refloor" }

[[renderer]]
compose = { preset = "raycast-gpu", storage = "distance", traversal = "sphere" }

[output]
compare = { every = 100 }
