# The served split measured: one pipeline swept over the network to the client (a gate), the
# generator's placement and how the client gets its LOD levels. Each pass reports the bytes
# over its gate, the update cost per byte, the chunks of its region missing per frame
# (the server's backlog, inside the gate, not generated yet) and the first frame with none
# missing (frame, simulated clock, wall time); the run prints them as the `stream` table
# and observations carry them (`stream`). A 10 s flight over terrain with edits around the
# start (so generating clients get some bytes too); time is simulated, so runs repeat.
name = "stream"

[scene]
generator = { type = "terrain", seed = 21 }
camera = { type = "line", from = [0, 150, 0], to = [300, 150, 75] }
events = [
    { type = "random_edits", every = 2, count = 500, seed = 5, center = [0, 120, 0], radius = 60, block = "toggle" },
    { type = "sphere", frame = 120, center = [60, 120, 15], radius = 18, block = "air" },
]

[run]
frames = 600
warmup = 0
resolution = [1280, 720]
modes = ["unlit"]
view_radius = 6

[[renderer]]
graph = "raycast-gpu"
vary = [
    # How the client gets its LOD levels (picked from the stream, or derived from level 0).
    { any = [
        [],
        [{ add = "client", role = "client", component = "pick" }, { node = "client", knobs = { radius = 3, max_lod = 2 } }],
        [{ add = "client", role = "client", component = "derive" }, { node = "client", knobs = { radius = 3, max_lod = 2 } }],
    ] },
    # The generator on the server (chunks streamed) or on the client (only edits cross the gate).
    { any = [[], [{ add = "generator", role = "generator", component = "procedural" }, { node = "generator", device = "cpu" }]] },
    # The network into the client: none, a LAN, a home connection, a bad one.
    { any = [
        [],
        [{ add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" }, { node = "net", knobs = { latency_ms = 1.0, bandwidth_mbps = 1000.0 } }],
        [{ add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" }, { node = "net", knobs = { latency_ms = 30.0, jitter_ms = 10.0, bandwidth_mbps = 200.0, loss = 0.01, reorder = true, resend = true } }],
        [{ add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" }, { node = "net", knobs = { latency_ms = 150.0, jitter_ms = 80.0, bandwidth_mbps = 50.0, loss = 0.05, reorder = true, resend = true } }],
    ] },
]

[output]
compare = { every = 50 }
