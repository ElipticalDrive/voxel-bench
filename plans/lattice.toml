# Jungle gym of 1-block beams every 24 blocks along all three axes; the camera turns on the
# spot inside it. Rays pass close to many thin beams before they hit one, so empty-space
# skipping and distance fields gain little, while rasterisers draw few faces: ray casters
# are 4x slower than with beams every 8 blocks and rasterisers win by 10x. At LOD the beams
# alias or vanish (the LOD variant shows it).
name = "lattice"

[scene]
generator = { type = "lattice" }
camera = { type = "spin", period = 300, pitch_deg = -10 }

[run]
frames = 300
resolution = [1920, 1080]
modes = ["unlit", "lit"]
view_radius = 12

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "client", role = "client", component = "pick" },
    { node = "client", knobs = { max_lod = 2, radius = 3 } },
]
label = "lod r3+2"

[output]
compare = { every = 100 }
save = { every = 0 }
