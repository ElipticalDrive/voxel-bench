# The link as a modelled network: a 10 s flight (600 frames on the 60 fps
# simulated clock, ~30 m/s) over terrain, each renderer's client receiving the server's
# stream over a link with latency, jitter, a bandwidth, losses (resent after a timeout) and,
# with `reorder`, chunks overtaking each other. Chunks are sent uncompressed (a dense one is
# 64 KiB): at 200 Mbit/s the first region takes seconds. Renderers draw what has arrived;
# quality against the reference (which stays on a free link) shows the holes. Time is
# simulated (`run.clock_fps`), so runs repeat. The link is a graph node (added by an
# edit, component `net`, knobs as in `mr_core::link::LinkSpec`); without one the link is free.
# With the generator on the client (a `generator` node on `cpu`) only edits cross the link:
# the client generates its region from the world's spec.
name = "link"

[scene]
generator = { type = "terrain", seed = 21 }
camera = { type = "line", from = [0, 150, 0], to = [300, 150, 75] }

[run]
frames = 600
warmup = 0
resolution = [1280, 720]
modes = ["unlit"]
view_radius = 8

[[renderer]]
graph = "raycast-gpu"
label = "free"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "link", role = "link", component = "net" },
    { node = "link", knobs = { bandwidth_mbps = 1000.0, latency_ms = 1.0 } },
]
label = "lan"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "link", role = "link", component = "net" },
    { node = "link", knobs = { bandwidth_mbps = 200.0, jitter_ms = 10.0, latency_ms = 30.0, loss = 0.01, reorder = true } },
]
label = "home"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "link", role = "link", component = "net" },
    { node = "link", knobs = { bandwidth_mbps = 200.0, jitter_ms = 10.0, latency_ms = 30.0, loss = 0.01 } },
]
label = "home, in order"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "link", role = "link", component = "net" },
    { node = "link", knobs = { bandwidth_mbps = 50.0, jitter_ms = 80.0, latency_ms = 150.0, loss = 0.05, reorder = true } },
]
label = "bad"

[[renderer]]
graph = "raster-gpu"
edits = [
    { add = "link", role = "link", component = "net" },
    { node = "link", knobs = { bandwidth_mbps = 200.0, jitter_ms = 10.0, latency_ms = 30.0, loss = 0.01, reorder = true } },
]
