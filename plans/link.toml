# The server-to-client network modelled: a 10 s flight (600 frames on the 60 fps simulated
# clock, ~30 m/s) over terrain, each renderer's client receiving the server's stream through
# a gate with latency, jitter, a bandwidth, packet losses (resent after a timeout) and, with
# `reorder`, chunks overtaking each other (each chunk's own messages stay in order). Chunks
# are sent uncompressed (a dense one is 64 KiB): at 200 Mbit/s the first region takes
# seconds. Renderers draw what has arrived; quality against the reference (which stays
# ungated) shows the holes. Time is simulated (`run.clock_fps`), so runs repeat. The network
# is a gate node reading the world (component `net`, knobs as in `mr_core::gate::GateSpec`):
# a gate reading the world carries its whole stream into the client, whichever of the
# world's readers it is drawn to. With the generator on the client (a `generator` node on
# `cpu`) only edits cross the gate: the client generates its region from the world's spec.
name = "link"

[scene]
generator = { type = "terrain", seed = 21 }
camera = { type = "line", from = [0, 150, 0], to = [300, 150, 75] }

[run]
frames = 600
warmup = 0
resolution = [1280, 720]
modes = ["unlit"]
view_radius = 8

[[renderer]]
graph = "raycast-gpu"
label = "free"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" },
    { node = "net", knobs = { bandwidth_mbps = 1000.0, latency_ms = 1.0 } },
]
label = "lan"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { add = "net", role = "gate", component = "net" }, { node = "net", input = "in", from = "world" }, { node = "storage", input = "changes", from = "net" },
    { node = "net", knobs = { bandwidth_mbps = 200.0, jitter_ms = 10.0, latency_ms = 30.0, loss = 0.01, reorder = true, resend = true } },
]
label = "home"

[[renderer]]
graph = "raycast-gpu"
