# Fast straight flight across the terrain (~4 km in 600 frames) with a per-frame chunk
# budget: measures streaming throughput, remeshing cost and pop-in (quality drops when a
# renderer lags behind).
name = "streaming"

[scene]
generator = { type = "terrain", seed = 21 }
camera = { type = "line", from = [0, 150, 0], to = [4000, 150, 1000] }

[run]
frames = 600
warmup = 0
resolution = [1920, 1080]
modes = ["unlit"]
view_radius = 16
streaming = { budget = 400 }

[[renderer]]
graph = "raycast-gpu"

[[renderer]]
graph = "raster-gpu"

[[renderer]]
graph = "raster-cpu"

[[renderer]]
graph = "rayquery-gpu"

[[renderer]]
graph = "rayquery-gpu"
edits = [{ node = "geometry", component = "boxes" }]

[[renderer]]
graph = "raycast-gpu"
edits = [{ node = "storage", component = "tree64" }]

[[renderer]]
graph = "raycast-cpu"

[[renderer]]
graph = "raycast-gpu"
edits = [
    { node = "kernel", component = "sphere" },
    { node = "storage", component = "distance" },
]

[output]
compare = { every = 100 }
