# The GUI's starting point (📂 Open ▸ New): terrain under the sun, a camera to fly (any
# movement key), one renderer with the default components. The demos (plans/demo-*.toml,
# the 🎬 Demos menu) show more.
name = "playground"

[scene]
generator = { type = "terrain", seed = 7 }
camera = { type = "static", pitch_deg = -10 }

[run]
resolution = [1280, 720]
view_radius = 10

[[renderer]]
compose = { backend = "gpu-compute" }
