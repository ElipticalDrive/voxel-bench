# The full sweep: every shipped pipeline graph with each of its nodes given every component
# the graph takes there, and its optional nodes present and absent. Read by `sweep.py` and
# `ab/wgsl.py`, which pass it as `-s renderer=[...]` over the scenario plans.
renderer = [
    { graph = "raycast-gpu", vary = [
        { node = "storage", component = "*" },
        { any = [[], [{ add = "prepass", role = "prepass", component = "beam" }, { node = "prepass", input = "storage", from = "storage" }, { node = "visibility", input = "start", from = "prepass" }]] },
        { node = "kernel", component = "*" },
        { node = "shading", component = "*" },
        { any = [[], [{ remove = "meshes" }]] },
    ] },
    { graph = "raycast-cpu", vary = [{ node = "storage", component = "*" }, { node = "kernel", component = "*" }, { node = "shading", component = "*" }] },
    { graph = "rayquery-gpu", vary = [{ node = "geometry", component = "*" }, { node = "shading", component = "*" }] },
    { graph = "raster-gpu", vary = [
        { node = "storage", component = "*" },
        { node = "geometry", component = "*" },
        { node = "draw", component = "*" },
        { node = "kernel", component = "*" },
        { node = "shading", component = "*" },
        { any = [[], [{ remove = "meshes" }]] },
    ] },
    { graph = "raster-cpu", vary = [
        { node = "storage", component = "*" },
        { node = "geometry", component = "*" },
        { node = "draw", component = "*" },
        { node = "kernel", component = "*" },
        { node = "shading", component = "*" },
    ] },
    { graph = "discover-gpu", vary = [{ node = "storage", component = "*" }, { node = "draw", component = "*" }, { node = "kernel", component = "*" }, { node = "shading", component = "*" }] },
    { graph = "discover-cpu", vary = [
        { node = "storage", component = "*" },
        { any = [[], [{ node = "visibility", component = "cluster" }, { node = "visibility", device = "default" }]] },
        { node = "draw", component = "*" },
        { node = "shading", component = "*" },
    ] },
    # The shadow walk's storage beside the CPU visibility (the default `bricks` is in the entry above).
    { graph = "discover-cpu", vary = [
        { node = "shadow.storage", component = "*", except = ["bricks"] },
        { node = "shadow.kernel", component = "*" },
    ] },
    # Holes filled by coverage (as plans/demo-pathtrace-discovery.toml).
    { graph = "discover-gpu", edits = [
        { add = "holes", role = "holes", component = "coverage" },
        { node = "draw", input = "faces", when = { iterate = 2 } },
        { node = "holes", input = "covered", from = "draw" },
        { node = "holes", input = "sky", from = "draw" },
        { node = "holes", input = "sky", when = "prev" },
        { node = "visibility", input = "where", from = "holes" },
    ], vary = [{ node = "draw", component = "*" }, { node = "shading", component = "*" }] },
    # Path-traced bounces walking a voxel storage inside the ray-query pass.
    { graph = "rayquery-gpu", edits = [
        { node = "shading", component = "pathtrace" },
        { add = "walk", role = "traversal", component = "refloor" },
        { add = "store", role = "storage", component = "bricks" },
        { node = "store", input = "changes", from = "world" },
        { node = "walk", input = "storage", from = "store" },
        { node = "shading", input = "bounce", from = "walk" },
    ], vary = [{ node = "store", component = "*" }, { node = "walk", component = "*" }] },
    { graph = "splat-gpu", vary = [{ node = "storage", component = "*" }, { node = "kernel", component = "*" }, { node = "shading", component = "*" }] },
    { graph = "columns-gpu", vary = [{ node = "shading", component = "*" }] },
    { graph = "columns-cpu", vary = [{ node = "shading", component = "*" }] },
]
