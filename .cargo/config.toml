# Forced code alignment (functions to 64 bytes, loop / branch targets to 32): without it,
# host-bound fps moved 5-8% between builds from code layout alone (relinking shifted hot
# loops such as the CPU mesher), drowning the zero-cost check.
# With it, two builds of unrelated changes measured within noise, and fps sat between the
# unaligned builds' readings. A plain `RUSTFLAGS` environment variable replaces this.
[build]
rustflags = ["-C", "llvm-args=-align-all-functions=6", "-C", "llvm-args=-align-all-nofallthru-blocks=5"]
