[package]
name = "multirenderer"
version = "0.1.0"
edition = "2024"
default-run = "multirenderer"

[workspace]
members = [
    "crates/mr-core",
    "crates/mr-world",
    "crates/mr-ipc",
    "crates/mr-worker",
    "crates/mr-serve",
    "crates/mr-gpu",
    "crates/mr-mesh",
    "renderers/cpu-reference",
    "components",
    "backends/gpu-compute",
    "backends/cpu",
    "backends/gpu-raster",
    "backends/gpu-rt",
    "backends/cpu-raster",
    "backends/discover",
    "backends/gpu-splat",
    "backends/voxelspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mr-core = { path = "crates/mr-core" }
mr-world = { path = "crates/mr-world" }
mr-ipc = { path = "crates/mr-ipc" }
mr-worker = { path = "crates/mr-worker" }
mr-serve = { path = "crates/mr-serve" }
mr-gpu = { path = "crates/mr-gpu" }
mr-mesh = { path = "crates/mr-mesh" }
cpu-reference = { path = "renderers/cpu-reference" }
backend-cpu-raster = { path = "backends/cpu-raster" }
backend-discover = { path = "backends/discover" }
backend-cpu = { path = "backends/cpu" }
backend-gpu-splat = { path = "backends/gpu-splat" }
backend-voxelspace = { path = "backends/voxelspace" }
mr-components = { path = "components" }
gpu-compute = { path = "backends/gpu-compute" }
backend-gpu-raster = { path = "backends/gpu-raster" }
backend-gpu-rt = { path = "backends/gpu-rt" }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
memmap2 = "0.9"
pollster = "1"
postcard = { version = "1", features = ["use-std"] }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
softbuffer = "0.4"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30", features = ["naga-ir"] }
naga_oil = { version = "=0.23.0", default-features = false }
winit = "0.30"
eframe = "0.36"
egui = "0.36"
egui_plot = "0.37"

[dependencies]
mr-core.workspace = true
mr-components.workspace = true
mr-world.workspace = true
mr-ipc.workspace = true
mr-worker.workspace = true
mr-gpu.workspace = true
backend-cpu.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
glam.workspace = true
image.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
softbuffer.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
eframe.workspace = true
egui.workspace = true
egui_plot.workspace = true

[dev-dependencies]
pollster.workspace = true

[profile.release]
debug = "line-tables-only"
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
