# scripts/check.py on every push: builds, clippy and tests without warnings, and the Windows
# cross-checks. No GPU here, so not the end-to-end tests (`check.py gpu`). The toolchain is the
# one `rust-toolchain.toml` pins (rustup installs it, with its components and targets).
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check.py build clippy test windows
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: target/logs/
